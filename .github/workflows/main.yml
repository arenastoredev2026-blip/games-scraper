name: Auto Sync Mod Games

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests cloudscraper

      - name: Run Scraper Script
        run: python scraper.py
